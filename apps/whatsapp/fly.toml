# Deploy desde la raíz del repo:
#   fly deploy --config apps/whatsapp/fly.toml .
# (el "." final es el contexto de build = raíz del monorepo)

app = "colonia-crm-whatsapp"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3002"
  WHATSAPP_SESSION_PATH = "/data/whatsapp-sessions"

[[mounts]]
  source = "whatsapp_sessions"
  destination = "/data"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
